name: Build and Deploy Cybeat

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cybeat-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cybeat.sibeux.my.id/api' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/cybeat_deploy_key"
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          echo "SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Trust RumahWeb SSH host
        run: ssh-keyscan -p 2223 jembayan.iixcp.rumahweb.net >> ~/.ssh/known_hosts

      - name: Deploy dist to shared hosting
        run: >-
          rsync -az --delete
          -e "ssh -i $SSH_KEY_FILE -p 2223 -o IdentitiesOnly=yes"
          dist/
          sibn9212@jembayan.iixcp.rumahweb.net:public_html/cybeat.sibeux.my.id/
