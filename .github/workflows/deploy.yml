name: Build and Deploy Cybeat

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cybeat-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://cybeat.sibeux.my.id/api' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust RumahWeb SSH host
        run: ssh-keyscan -p 2223 jembayan.iixcp.rumahweb.net >> ~/.ssh/known_hosts

      - name: Deploy dist to shared hosting
        run: >-
          rsync -az --delete
          -e "ssh -p 2223"
          dist/
          sibn9212@jembayan.iixcp.rumahweb.net:public_html/cybeat.sibeux.my.id/
